# Production stack: database, web app and background worker.
#
#   cp .env.example .env      # fill in the REQUIRED values
#   docker compose up -d --build
#   docker compose exec app npx prisma migrate deploy
#   docker compose exec app npm run seed
#   docker compose exec -it app npm run bootstrap:owner
#   docker compose exec app npm run check
#
# The worker is a separate service on purpose. Without it nothing is ingested
# and no week is ever planned.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-videowalla}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-videowalla_crm}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-videowalla} -d ${POSTGRES_DB:-videowalla_crm}']
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host by default — the database should not be
    # reachable from the internet. Uncomment only for local inspection.
    # ports:
    #   - '127.0.0.1:5432:5432'

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-videowalla}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-videowalla_crm}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      CRON_SECRET: ${CRON_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      SMTP_URL: ${SMTP_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '${PORT:-3000}:3000'

  worker:
    build: .
    restart: unless-stopped
    command: ['npm', 'run', 'worker']
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-videowalla}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-videowalla_crm}?schema=public
      SESSION_SECRET: ${SESSION_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      APP_URL: ${APP_URL:-http://localhost:3000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      SMTP_URL: ${SMTP_URL:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      LOG_LEVEL: ${LOG_LEVEL:-info}

volumes:
  db-data:
